  description: >
    `MatCheckbox` declares `aria-label` as an `@Input` and explicitly nulls
    the host attribute, so binding `[attr.aria-label]` never reaches the
    native input and every row checkbox ends up unlabeled. It must be bound as
    `[aria-label]`.
