target-version = "py310"
line-length = 100

# The review-gate evaluation corpus stores fixtures whose whole purpose is to
# carry a defect — a missing import, an unclosed literal that does not even
# parse. Linting or formatting them would either fail the run or silently
# repair the thing under test. force-exclude honours this for the pre-commit
# hook too, which passes changed files by explicit path.
extend-exclude = ["software_engineering_team/eval_corpus"]
force-exclude = true

[lint]
select = ["E", "F", "I", "C901", "PLR0915"]
ignore = ["E501"]

# isort's default first-party detection resolves relative to this file's own
# directory (agents/), so it can no longer see backend/shared/ (one level up)
# to recognize `shared.<pkg>` imports as first-party the way it recognized the
# pre-relocation flat `shared_<pkg>` names living under agents/. Declare it
# explicitly — matches the repo-root pyproject.toml's isort config.
[lint.isort]
known-first-party = ["shared"]

# Complexity gating. ruff resolves THIS config (not the repo-root pyproject.toml)
# for everything under agents/, so the thresholds and grandfathered debt list
# must live here to take effect under CI's `ruff check agents/`. High-water-mark
# being ratcheted down toward the ruff defaults (10 / 50) as functions are
# decomposed: statements 150 -> 130 (next stop 120 needs ~3 more decompositions);
# complexity stays at 40 until the execution-pipeline functions are split.
[lint.mccabe]
max-complexity = 40

[lint.pylint]
max-statements = 130

[lint.per-file-ignores]
# Tests and example scripts are setup-heavy by nature — exempt from complexity.
"**/tests/**" = ["C901", "PLR0915"]
"**/agent_implementations/**" = ["C901", "PLR0915"]
# Complexity debt: pre-existing functions above the thresholds above. Exempted
# per-rule (paths are relative to agents/); refactor and remove to ratchet down.
"software_engineering_team/orchestrator.py" = ["C901", "PLR0915"]
# _try_build_fix_one_at_a_time was moved verbatim from orchestrator.py (its
# complexity moved with the code); tracked for decomposition under a follow-up.
"software_engineering_team/build_fix.py" = ["C901", "PLR0915"]
"llm_service/clients/ollama.py" = ["C901", "PLR0915"]
"team_assistant/api.py" = ["C901", "PLR0915"]
"investment_team/api/main.py" = ["PLR0915"]
# The gated microtask loop was unified into one shared skeleton
# (run_gated_execution_impl); the two per-team execution.py wrappers are now thin
# and no longer need the exemption, so the debt is consolidated to the one copy.
"software_engineering_team/shared/phases/execution.py" = ["PLR0915"]
"software_engineering_team/product_requirements_analysis_agent/agent.py" = ["PLR0915"]

[format]
quote-style = "double"
indent-style = "space"
